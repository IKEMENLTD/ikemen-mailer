# render.yaml — Render Blueprint for Hakobu (listmonk fork).
# Defines a free PostgreSQL database + a free Docker web service and wires the DB
# credentials into the app via LISTMONK_* env vars. The admin password is generated
# by Render (never committed to this public repo).
#
# Deploy: Render Dashboard → New → Blueprint → connect IKEMENLTD/ikemen-mailer.
# Render reads this file, provisions both resources, and builds from Dockerfile.render.

databases:
  - name: ikemen-mailer-db
    databaseName: listmonk
    user: listmonk
    plan: free

services:
  - type: web
    name: ikemen-mailer
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.render
    autoDeploy: true
    envVars:
      # --- DB: pulled from the managed Postgres above ---
      - key: LISTMONK_db__host
        fromDatabase:
          name: ikemen-mailer-db
          property: host
      - key: LISTMONK_db__port
        fromDatabase:
          name: ikemen-mailer-db
          property: port
      - key: LISTMONK_db__user
        fromDatabase:
          name: ikemen-mailer-db
          property: user
      - key: LISTMONK_db__password
        fromDatabase:
          name: ikemen-mailer-db
          property: password
      - key: LISTMONK_db__database
        fromDatabase:
          name: ikemen-mailer-db
          property: database
      # Render Postgres requires SSL.
      - key: LISTMONK_db__ssl_mode
        value: require
      - key: LISTMONK_db__max_open
        value: "25"
      - key: LISTMONK_db__max_idle
        value: "25"
      - key: LISTMONK_db__max_lifetime
        value: "300s"
      - key: TZ
        value: Asia/Tokyo
      # --- First-run super admin (auto-created on --install) ---
      - key: LISTMONK_ADMIN_USER
        value: admin
      # Render generates a strong value; view it in Dashboard → ikemen-mailer → Environment.
      - key: LISTMONK_ADMIN_PASSWORD
        generateValue: true
